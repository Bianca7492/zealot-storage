org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# The SDK's version. This is the one place to bump it for a local build; CI overrides it with
# -PzealotSdkVersion=<tag version> when publishing from a tag. `gradle.properties` is read by
# findProperty() automatically, so the publish workflow can read it back with a plain grep.
zealotSdkVersion=1.5.0
