# Tasks 40i-a and 40i-c: the upload workflow (stage 1 reads, stage 2 builds). Copy this file into the STORAGE repo as
# `.github/workflows/read-upload.yml` (the repo named by GITHUB_STORAGE_REPO / CI_COMPILE_REPO on Render), on the
# branch CI_COMPILE_REF names (default main). It does not belong in the Zealot repo's own `.github/workflows/`
# (see "Which workflow is the deploy pipeline?" in handover.md).
#
# What it does, for one staged upload, when Zealot dispatches it (ReleaseUploadDispatcher, after the owner's
# finalize call):
#   1. downloads the file from the R2 staging bucket (the object Zealot's presigned URL received);
#   2. computes its SHA-256 and size;
#   3. reads the manifest: for an APK, `aapt2 dump badging`; for an AAB, bundletool builds a throwaway universal
#      APK first and aapt2 reads that. That gives package name, version code and name, label, SDK levels and ABIs;
#   4. extracts the app icon when it is a PNG or WebP and puts it back into the staging bucket next to the file;
#   5. asks GitHub for an OIDC ID token whose audience is Zealot's URL, and reports everything to Zealot once
#      (POST /api/release_uploads/<upload_id>/stage1). Zealot verifies the token (signature, audience, this
#      repository, the workflow_dispatch event and this exact workflow file on the expected branch), so NO
#      shared secret is stored anywhere for this callback.
# If any step fails, the last step reports `state: failed` with a reason, so a broken run shows up on the upload
# instead of leaving it waiting.
#
# Two jobs, so the file is parsed with the least privilege:
#   read   (contents read, the R2 token, no signing key) reads and reports (stage 1). Zealot answers with the
#          release it made, held, and the storage tag its files go under.
#   build  (Task 40i-c; needs `read`; contents write, the R2 token and the signing key) downloads the staged file
#          again, checks it is the file `read` hashed, uploads it and the icon to the storage release
#          `a<app>-r<release>`, and for a bundle builds and signs the universal APK and the Brotli-compressed
#          device-split set (as compile-aab.yml does). It then reports once more (POST
#          /api/release_uploads/<upload_id>/stage2) with the same kind of OIDC token. Zealot derives every storage
#          key itself, checks each object is in the storage release (and the signing certificate, when
#          CI_COMPILE_EXPECT_CERT_SHA256 is set on Render) and only then makes the release available (unless the
#          owner asked to hold it) and deletes the staged objects. An APK is stored as uploaded: nothing is built.
#          With SDK_INJECTION=true (Task 40n-b) the Proxies SDK goes into BUNDLES only: a COPY of the bundle is
#          patched (manifest provider and permission, SDK dex at the next free classesN.dex; lib/aab_sdk_patcher.py)
#          and the universal APK is built from that copy and signed with the organisation key. The bundle stored
#          and uploaded for Play is the clean one, byte for byte; the patched copy never leaves the runner. The
#          device-split set is still built from the clean bundle. An uploaded APK is injected too (Task 40j/40n-b,
#          consent slice): the same manifest hooks (API-key meta-data, provider, consent Activity, SDK service)
#          and the same provider dex as the bundle path (lib/proxy_sdk_patcher.py). Patching strips the APK's
#          signature, so it is then re-signed with the organisation key (the step `Read the uploaded APK's
#          signature` is skipped for an injected APK; `Sign the injected APK` runs instead) and reported as
#          org_signed, not sdk_injected -- the finisher refuses an APK that says both.
#          (apksigner). Zealot decides: with REQUIRE_ORG_SIGNED_APKS=true on Render an APK not signed with the
#          organisation key is rejected with a stated reason, so nothing signed by anyone else is published. If the
#          built universal APK does not carry the SDK (manifest entry AND provider class in its dex), the run
#          fails and nothing is uploaded.
#
# Storage-repo SECRETS (Settings > Secrets and variables > Actions > Secrets):
#   R2_STAGING_CI_ACCESS_KEY_ID      } an R2 API token (Object Read and Write, scoped to the staging bucket)
#   R2_STAGING_CI_SECRET_ACCESS_KEY  } created for CI, not the one Render uses
#   RELEASE_KEYSTORE_BASE64          } stage 2, bundles only: the organisation .jks (`base64 -w0 release.jks`),
#   RELEASE_KEYSTORE_PASSWORD        } its password, the key alias and the key password (leave RELEASE_KEY_PASSWORD
#   RELEASE_KEY_ALIAS                } unset if it equals the keystore password). The same four secrets and the
#   RELEASE_KEY_PASSWORD             } same certificate as compile-aab.yml and the Storeapp patch.
#   PROXIES_API_KEY                  } stage 2 with SDK_INJECTION=true, bundles only: the API key the injected SDK is
#                                    } given (what Render's PROXIES_API_KEY was).
# Storage-repo FILES for SDK injection (Task 40n-b; copy from the Zealot repo, commit to the storage repo, and keep
# this folder layout: the patcher finds its Java helper in the folder beside itself):
#   zealot-ci/aab_sdk_patcher.py                     <- lib/aab_sdk_patcher.py
#   zealot-ci/aab_manifest_patch/ManifestPatch.java  <- lib/aab_manifest_patch/ManifestPatch.java
#   zealot-ci/proxies_sdk.dex                        <- proxies_sdk.dex (the SDK's own classes only -- see below)
#   zealot-ci/ZealotProxyProvider.java                <- lib/zealot_provider/ZealotProxyProvider.java
#   zealot-ci/ZealotConsentActivity.java              <- lib/zealot_provider/ZealotConsentActivity.java
#     (operator-directed 2026-10-13: the dynamic consent banner; compiled into the SAME provider dex
#      as ZealotProxyProvider.java below, and declared in the manifest by ManifestPatch.java)
#   zealot-ci/ZealotConsentOverlay.java               <- lib/zealot_provider/ZealotConsentOverlay.java
#     (operator-directed 2026-10-13: the consent sheet injected as a VIEW into the host's resumed
#      Activity, so it lands on the home for any navigation shape; a background Activity start is
#      barred since Android 10. Compiled into the SAME provider dex; the Activity above is its fallback.)
#   zealot-ci/proxy_sdk_patcher.py                    <- lib/proxy_sdk_patcher.py (Task 40j; now takes the
#                                                           provider dex as a 5th argument for the CI APK branch)
# Storage-repo FILES for Task 47c (the in-app updater; bundles only, behind the variable UPDATER_INJECTION and the
# publisher's per-app switch, which stage 1 returns as `updater_enabled`; copy from the Zealot repo, same layout):
#   zealot-ci/zealot_updater/com/zealot/updater/*.java  <- lib/zealot_updater/com/zealot/updater/*.java (compiled fresh every run:
#                                                           javac against the runner's android.jar, then d8, as for ZealotProxyProvider)
#   zealot-ci/check-manifest-resource-ids.py            <- docs/ci/test/check-manifest-resource-ids.py (the build fails if an injected
#                                                           attribute has no resource id or `exported` is not a boolean)
#   zealot-ci/aab_sdk_patcher.py and aab_manifest_patch/ManifestPatch.java must be the Task 47b versions (the updater's manifest
#   entries); an older copy ignores the base URL and the updater would not be declared.
# Storage-repo FILES for Task 40p (the pre-existing-SDK scan; runs for every upload, APK or AAB, regardless of
# SDK_INJECTION -- also copy these from the Zealot repo and commit to the storage repo under zealot-ci/):
#   zealot-ci/scan_bandwidth_sdks.py          <- lib/scan_bandwidth_sdks.py
#   zealot-ci/bandwidth_sdk_fingerprints.yml  <- lib/bandwidth_sdk_fingerprints.yml
#
# Task 40n fix (2026-10-05): proxies_sdk.dex does NOT need, and never had, a com.zealot.proxy.*
# class in it -- that earlier note was wrong. The real SDK is sx.proxies.peer.ProxiesPeerSDK
# (Kotlin, read from the dex with androguard, not guessed). The "Compile ZealotProxyProvider" step
# below compiles zealot-ci/ZealotProxyProvider.java fresh every run (javac against the runner's own
# android.jar, then d8) into its OWN dex file, which the patcher adds alongside proxies_sdk.dex as a
# second classesN.dex slot (Android's normal multidex loading finds classes across dex files, so the
# two never need to be merged). ZealotProxyProvider.java itself talks to the SDK only by reflection
# (Class.forName on sx.proxies.peer.ProxiesPeerSDK and its nested Config class), so it has no
# compile-time dependency on the SDK or the Kotlin stdlib and needs nothing from proxies_sdk.dex to
# compile. The "Check the SDK is in the universal APK" step below greps the built APK's dex for the
# class name as a run-time sanity check, not because the provider is expected to live in the SDK's
# own dex.
# Storage-repo VARIABLES (same page, Variables tab):
#   ZEALOT_URL            https://<your zealot host>, no trailing path. Must equal CI_OIDC_AUDIENCE on Render
#                         (or https://<ZEALOT_DOMAIN> when that is what Render has).
#   R2_STAGING_ENDPOINT   https://<account id>.r2.cloudflarestorage.com
#   R2_STAGING_BUCKET     the staging bucket name
#   RELEASE_CERT_SHA256   optional; the signing certificate's SHA-256 (hex, with or without colons). When set,
#                         stage 2 refuses to upload anything signed by another certificate.
#   SDK_INJECTION         optional; `true` turns on Proxies SDK injection into bundles in stage 2 (Task 40n-b). Off
#                         unless set; an APK upload is not affected by it.
#   UPDATER_INJECTION     optional; `true` turns on the in-app updater injection into BUNDLES in stage 2 (Task 47c), for every app whose
#                         publisher has not switched it off. Set the same value on Render (`UPDATER_INJECTION=true`) so the release
#                         page stops saying "not added yet". Works with SDK_INJECTION on or off; the clean bundle is never touched.
#   SIGN_UPLOADED_APKS    must NOT be set (Task 40n-c). Zealot never re-signs an uploaded APK; with it `true` the
#                         `Check the inputs` step fails the run. Delete the variable if it exists.
#   BUNDLETOOL_VERSION    optional; default below, 1.18.3, the version the AAB patcher was proven against (only used for
#                         .aab files). If you set BUNDLETOOL_SHA256 for an older version, update it too.
#   BUNDLETOOL_SHA256     optional; SHA-256 of that bundletool jar; checked when set
#
# Job `read` needs `id-token: write` and nothing else (no write access to the repo). Job `build` also needs
# `contents: write`, to create the storage release and upload to it with the run's own GITHUB_TOKEN; no other
# token is used. The storage repo should be private (Task 40 decision 5).
#
# Not run. Written without testing (operator's standing instruction); parsed as YAML and its shell steps
# syntax-checked with `bash -n` only. What has never been exercised: the aapt2 output patterns, the bundletool
# flags, the R2 download and upload through the aws CLI, the OIDC token request and the callback.

name: Read upload (Zealot)

on:
  workflow_dispatch:
    inputs:
      upload_id:
        description: "Zealot upload id (digits)"
        required: true
        type: string
      staging_key:
        description: "Object key in the R2 staging bucket, e.g. staging/a12/u34/<32 hex>/app.apk"
        required: true
        type: string
      filename:
        description: "File name of the upload, ending in .apk or .aab"
        required: true
        type: string

# One run per upload at a time.
concurrency:
  group: read-upload-${{ inputs.upload_id }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  BUNDLETOOL_VERSION: ${{ vars.BUNDLETOOL_VERSION || '1.18.3' }}
  # Cloudflare R2 rejects the newer AWS CLI's default checksum headers.
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
  AWS_DEFAULT_REGION: auto

jobs:
  read:
    name: Read upload ${{ inputs.upload_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # What `build` needs from the stage-1 answer and report. Nothing here is secret.
    outputs:
      release_id: ${{ steps.callback.outputs.release_id }}
      storage_tag: ${{ steps.callback.outputs.storage_tag }}
      artifact_base: ${{ steps.callback.outputs.artifact_base }}
      file_sha256: ${{ steps.callback.outputs.file_sha256 }}
      icon_key: ${{ steps.callback.outputs.icon_key }}
      icon_sha256: ${{ steps.callback.outputs.icon_sha256 }}
      updater_enabled: ${{ steps.callback.outputs.updater_enabled }}
      store_name: ${{ steps.callback.outputs.store_name }}
      store_package: ${{ steps.callback.outputs.store_package }}
    steps:
      # Inputs reach the shell only through env, never by pasting ${{ }} into a script, and are checked against
      # strict patterns first. A bad value fails here, before anything is downloaded.
      - name: Check the inputs
        env:
          UPLOAD_ID: ${{ inputs.upload_id }}
          STAGING_KEY: ${{ inputs.staging_key }}
          FILENAME: ${{ inputs.filename }}
          ZEALOT_URL: ${{ vars.ZEALOT_URL }}
          R2_ENDPOINT: ${{ vars.R2_STAGING_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_STAGING_BUCKET }}
          R2_KEY_ID: ${{ secrets.R2_STAGING_CI_ACCESS_KEY_ID }}
          R2_SECRET: ${{ secrets.R2_STAGING_CI_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [[ $UPLOAD_ID =~ ^[0-9]+$ ]] || fail "upload_id must be digits"
          [[ $STAGING_KEY =~ ^staging/a[0-9]+/u[0-9]+/[0-9a-f]{32}/[A-Za-z0-9._-]+$ ]] || fail "staging_key has an unexpected shape"
          [[ $FILENAME =~ ^[A-Za-z0-9._-]+\.(apk|aab)$ ]] || fail "filename must be a plain name ending in .apk or .aab"
          [[ ${STAGING_KEY##*/} == "$FILENAME" ]] || fail "filename does not match the end of staging_key"
          [[ -n ${ZEALOT_URL:-} ]] || fail "the repository variable ZEALOT_URL is not set"
          [[ $ZEALOT_URL =~ ^https:// ]] || fail "ZEALOT_URL must start with https://"
          [[ -n ${R2_ENDPOINT:-} ]] || fail "the repository variable R2_STAGING_ENDPOINT is not set"
          [[ $R2_ENDPOINT =~ ^https:// ]] || fail "R2_STAGING_ENDPOINT must start with https://"
          [[ -n ${R2_BUCKET:-} ]] || fail "the repository variable R2_STAGING_BUCKET is not set"
          [[ -n ${R2_KEY_ID:-} ]] || fail "the secret R2_STAGING_CI_ACCESS_KEY_ID is not set"
          [[ -n ${R2_SECRET:-} ]] || fail "the secret R2_STAGING_CI_SECRET_ACCESS_KEY is not set"
          {
            echo "WORK=${RUNNER_TEMP}/read-${UPLOAD_ID}"
            echo "KIND=${FILENAME##*.}"
          } >> "$GITHUB_ENV"

      - name: Set up Java
        if: endsWith(inputs.filename, '.aab')
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache bundletool
        if: endsWith(inputs.filename, '.aab')
        id: bt-cache
        uses: actions/cache@v4
        with:
          path: ~/bundletool
          key: bundletool-${{ env.BUNDLETOOL_VERSION }}

      - name: Get bundletool
        if: endsWith(inputs.filename, '.aab') && steps.bt-cache.outputs.cache-hit != 'true'
        env:
          BUNDLETOOL_SHA256: ${{ vars.BUNDLETOOL_SHA256 }}
        run: |
          set -euo pipefail
          mkdir -p ~/bundletool
          curl -fsSL --retry 3 -o ~/bundletool/bundletool.jar \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          if [[ -n ${BUNDLETOOL_SHA256:-} ]]; then
            echo "${BUNDLETOOL_SHA256}  $HOME/bundletool/bundletool.jar" | sha256sum -c -
          else
            echo "::warning::BUNDLETOOL_SHA256 is not set; the bundletool jar was not checked against a known hash"
          fi

      - name: Download the staged file from R2
        env:
          STAGING_KEY: ${{ inputs.staging_key }}
          FILENAME: ${{ inputs.filename }}
          R2_ENDPOINT: ${{ vars.R2_STAGING_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_STAGING_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_STAGING_CI_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_STAGING_CI_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$WORK"
          aws s3 cp "s3://${R2_BUCKET}/${STAGING_KEY}" "$WORK/$FILENAME" --endpoint-url "$R2_ENDPOINT" --only-show-errors
          ls -l "$WORK/$FILENAME"

      # An AAB is not readable by aapt2, so bundletool builds a throwaway universal APK from it (signed with
      # bundletool's debug key if it finds one, otherwise unsigned: nothing here is ever installed or kept).
      - name: Make a readable APK from the bundle
        if: endsWith(inputs.filename, '.aab')
        env:
          FILENAME: ${{ inputs.filename }}
        run: |
          set -euo pipefail
          java -jar ~/bundletool/bundletool.jar build-apks --mode=universal \
            --bundle="$WORK/$FILENAME" --output="$WORK/universal.apks"
          unzip -o -q "$WORK/universal.apks" universal.apk -d "$WORK"
          echo "READABLE_APK=$WORK/universal.apk" >> "$GITHUB_ENV"

      - name: Point at the APK to read
        if: endsWith(inputs.filename, '.apk')
        env:
          FILENAME: ${{ inputs.filename }}
        run: echo "READABLE_APK=$WORK/$FILENAME" >> "$GITHUB_ENV"

      - name: Read the manifest, the hash and the icon
        env:
          STAGING_KEY: ${{ inputs.staging_key }}
          FILENAME: ${{ inputs.filename }}
          R2_ENDPOINT: ${{ vars.R2_STAGING_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_STAGING_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_STAGING_CI_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_STAGING_CI_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          AAPT2="$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -n 1)"
          [[ -x $AAPT2 ]] || { echo "::error::aapt2 was not found on this runner"; exit 1; }
          "$AAPT2" dump badging "$READABLE_APK" > "$WORK/badging.txt"

          python3 - <<'PY'
          import hashlib, json, os, re, zipfile

          work = os.environ["WORK"]
          filename = os.environ["FILENAME"]
          kind = os.environ["KIND"]
          staged = os.path.join(work, filename)

          def sha256(path):
              digest = hashlib.sha256()
              with open(path, "rb") as handle:
                  for chunk in iter(lambda: handle.read(1 << 20), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          badging = open(os.path.join(work, "badging.txt"), encoding="utf-8", errors="replace").read()

          def first(pattern, text=badging):
              match = re.search(pattern, text, re.MULTILINE)
              return match.group(1) if match else None

          package = re.search(
              r"^package: name='([^']+)' versionCode='(\d+)' versionName='([^']*)'", badging, re.MULTILINE)
          if not package:
              raise SystemExit("the manifest has no package line")

          report = {
              "state": "ok",
              "kind": kind,
              "package_name": package.group(1),
              "version_code": int(package.group(2)),
              "version_name": package.group(3) or "0",
              "app_label": first(r"^application-label:'([^']*)'"),
              "min_sdk": first(r"^(?:minSdkVersion|sdkVersion):'(\d+)'"),
              "target_sdk": first(r"^targetSdkVersion:'(\d+)'"),
              "abis": re.findall(r"'([A-Za-z0-9_-]+)'", first(r"^native-code: (.*)$") or ""),
              # Task 46a: every <uses-permission> the manifest declares (aapt2 prints one `uses-permission: name='...'`
              # line each, `uses-permission-sdk-23` for the runtime-only ones; `uses-implied-permission` is not one the
              # app asked for and is not matched). Empty is dropped from the body below like every other empty value.
              "permissions": sorted(set(re.findall(
                  r"^uses-permission(?:-sdk-23)?: name='([^']+)'", badging, re.MULTILINE))),
              "file_sha256": sha256(staged),
              "file_size": os.path.getsize(staged),
          }

          # Icon: the densest PNG or WebP the manifest names (an adaptive-icon XML cannot be used as a picture).
          icons = []
          for density, path in re.findall(r"^application-icon-(\d+):'([^']+)'", badging, re.MULTILINE):
              if path.lower().endswith((".png", ".webp")):
                  icons.append((int(density), path))
          fallback = first(r"^application: .*? icon='([^']+)'")
          if fallback and fallback.lower().endswith((".png", ".webp")):
              icons.append((0, fallback))
          # Task 43c-1: an adaptive icon (minSdk 26) is named by badging as an XML, e.g.
          # res/mipmap-anydpi-v26/ic_launcher.xml, so nothing above matched. The same resource name usually still has
          # a legacy raster beside it (res/mipmap-xxxhdpi-v4/ic_launcher.webp, read from Appstore 1.1.4's universal
          # APK on 2026-10-07). Take the densest PNG or WebP with exactly that name; a name such as ic_launcher_round
          # or ic_launcher_foreground is a different resource and never matches. Names that are listed but not present
          # are simply not found: the icon stays absent and the read never fails because of it.
          if not icons:
              named = [p for _, p in re.findall(r"^application-icon-(\d+):'([^']+)'", badging, re.MULTILINE)]
              if fallback:
                  named.append(fallback)
              stems = {os.path.splitext(os.path.basename(p))[0] for p in named if p.lower().endswith(".xml")}
              ranks = {"ldpi": 120, "mdpi": 160, "hdpi": 240, "xhdpi": 320, "xxhdpi": 480, "xxxhdpi": 640}
              with zipfile.ZipFile(os.environ["READABLE_APK"]) as archive:
                  for entry in archive.namelist():
                      found = re.match(r"^res/(?:mipmap|drawable)(?:-([a-z]+))?(?:-v\d+)?/([^/]+)\.(?:png|webp)$", entry)
                      if found and found.group(2) in stems and found.group(1) in (None, *ranks):
                          icons.append((ranks.get(found.group(1), 1), entry))
              if not icons:
                  print("::warning::the manifest names only an XML icon and no raster with that name is in the APK; no icon")
          if icons:
              icon_path = max(icons)[1]
              extension = os.path.splitext(icon_path)[1].lower()
              with zipfile.ZipFile(os.environ["READABLE_APK"]) as archive:
                  data = archive.read(icon_path)
              icon_file = os.path.join(work, "icon" + extension)
              with open(icon_file, "wb") as handle:
                  handle.write(data)
              report["icon_file"] = icon_file
              report["icon_sha256"] = hashlib.sha256(data).hexdigest()
              prefix = os.environ["STAGING_KEY"].rsplit("/", 1)[0]
              report["icon_key"] = prefix + "/icon" + extension

          with open(os.path.join(work, "report.json"), "w", encoding="utf-8") as handle:
              json.dump(report, handle)
          PY

          icon_file="$(jq -r '.icon_file // empty' "$WORK/report.json")"
          if [[ -n $icon_file ]]; then
            icon_key="$(jq -r '.icon_key' "$WORK/report.json")"
            aws s3 cp "$icon_file" "s3://${R2_BUCKET}/${icon_key}" --endpoint-url "$R2_ENDPOINT" --only-show-errors
          fi
          # The body Zealot receives: no local paths, no empty values.
          jq 'del(.icon_file) | with_entries(select(.value != null and .value != "" and .value != []))' \
            "$WORK/report.json" > "$WORK/body.json"
          jq -r '"package=\(.package_name) versionCode=\(.version_code) kind=\(.kind) icon=\(.icon_key // "none")"' \
            "$WORK/body.json"

      - name: Report to Zealot
        id: callback
        env:
          UPLOAD_ID: ${{ inputs.upload_id }}
          ZEALOT_URL: ${{ vars.ZEALOT_URL }}
        run: |
          set -euo pipefail
          base="${ZEALOT_URL%/}"
          token="$(curl -fsSL --max-time 30 \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${base}" | jq -r '.value')"
          [[ -n $token && $token != null ]] || { echo "::error::could not get an OIDC token"; exit 1; }
          echo "::add-mask::$token"
          code="$(curl -sS -o "$WORK/callback.out" -w '%{http_code}' --retry 3 --retry-all-errors --max-time 60 \
            -X POST "${base}/api/release_uploads/${UPLOAD_ID}/stage1" \
            -H "Authorization: Bearer ${token}" -H "Content-Type: application/json" \
            --data @"$WORK/body.json")"
          cat "$WORK/callback.out"; echo
          [[ $code == 200 ]] || { echo "::error::Zealot answered HTTP $code"; exit 1; }
          # Zealot made the release (held) and names the tag its files go under; stage 2 uses both.
          {
            echo "release_id=$(jq -r '.release_id // empty' "$WORK/callback.out")"
            echo "storage_tag=$(jq -r '.storage_tag // empty' "$WORK/callback.out")"
            echo "artifact_base=$(jq -r '.artifact_base // empty' "$WORK/callback.out")"
            # Task 47c: the publisher's switch; anything but a JSON true (including an older Zealot's silence) is false.
            echo "updater_enabled=$(jq -r 'if .updater_enabled == true then "true" else "false" end' "$WORK/callback.out")"
            # Task 47j: the tenant's branding for the injected update dialog, when Zealot named it. Absent for
            # the default tenant, where the updater's own first-party defaults stand.
            echo "store_name=$(jq -r '.store_name // empty' "$WORK/callback.out")"
            echo "store_package=$(jq -r '.store_package // empty' "$WORK/callback.out")"
            echo "file_sha256=$(jq -r '.file_sha256 // empty' "$WORK/body.json")"
            echo "icon_key=$(jq -r '.icon_key // empty' "$WORK/body.json")"
            echo "icon_sha256=$(jq -r '.icon_sha256 // empty' "$WORK/body.json")"
          } >> "$GITHUB_OUTPUT"

      # Runs only when an earlier step failed: tells Zealot, so the upload shows `failed` with a reason.
      - name: Report the failure to Zealot
        if: failure()
        env:
          UPLOAD_ID: ${{ inputs.upload_id }}
          ZEALOT_URL: ${{ vars.ZEALOT_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          [[ -n ${ZEALOT_URL:-} && -n ${UPLOAD_ID:-} ]] || exit 0
          base="${ZEALOT_URL%/}"
          token="$(curl -fsSL --max-time 30 \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${base}" | jq -r '.value')" || exit 0
          [[ -n $token && $token != null ]] || exit 0
          echo "::add-mask::$token"
          body="$(jq -n --arg e "The stage-1 read failed. See ${RUN_URL}" '{state: "failed", error: $e}')"
          curl -sS -o /dev/null --retry 3 --retry-all-errors --max-time 60 \
            -X POST "${base}/api/release_uploads/${UPLOAD_ID}/stage1" \
            -H "Authorization: Bearer ${token}" -H "Content-Type: application/json" \
            --data "$body" || true

      - name: Remove the working files
        if: always()
        run: rm -rf "${WORK:-/nonexistent}"

  # Task 40i-c: stage 2. Runs only when `read` succeeded, i.e. Zealot accepted the report and made the held release.
  build:
    name: Build upload ${{ inputs.upload_id }}
    needs: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
    steps:
      # Values from `read` and the inputs reach the shell only through env, are checked against strict patterns,
      # and every storage name used below is derived here from the tag, never taken from a free-form value.
      - name: Check the inputs
        env:
          UPLOAD_ID: ${{ inputs.upload_id }}
          STAGING_KEY: ${{ inputs.staging_key }}
          FILENAME: ${{ inputs.filename }}
          RELEASE_ID: ${{ needs.read.outputs.release_id }}
          TAG: ${{ needs.read.outputs.storage_tag }}
          ARTIFACT_BASE: ${{ needs.read.outputs.artifact_base }}
          FILE_SHA256: ${{ needs.read.outputs.file_sha256 }}
          ICON_KEY: ${{ needs.read.outputs.icon_key }}
          ICON_SHA256: ${{ needs.read.outputs.icon_sha256 }}
          ZEALOT_URL: ${{ vars.ZEALOT_URL }}
          R2_ENDPOINT: ${{ vars.R2_STAGING_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_STAGING_BUCKET }}
          R2_KEY_ID: ${{ secrets.R2_STAGING_CI_ACCESS_KEY_ID }}
          R2_SECRET: ${{ secrets.R2_STAGING_CI_SECRET_ACCESS_KEY }}
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          SDK_INJECTION: ${{ vars.SDK_INJECTION }}
          SIGN_UPLOADED_APKS: ${{ vars.SIGN_UPLOADED_APKS }}
          PROXIES_API_KEY: ${{ secrets.PROXIES_API_KEY }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [[ $UPLOAD_ID =~ ^[0-9]+$ ]] || fail "upload_id must be digits"
          [[ $STAGING_KEY =~ ^staging/a([0-9]+)/u[0-9]+/[0-9a-f]{32}/[A-Za-z0-9._-]+$ ]] || fail "staging_key has an unexpected shape"
          staged_app="${BASH_REMATCH[1]}"
          [[ $FILENAME =~ ^[A-Za-z0-9._-]+\.(apk|aab)$ ]] || fail "filename must be a plain name ending in .apk or .aab"
          [[ ${STAGING_KEY##*/} == "$FILENAME" ]] || fail "filename does not match the end of staging_key"
          [[ $RELEASE_ID =~ ^[0-9]+$ ]] || fail "stage 1 gave no release id"
          [[ $TAG =~ ^a([0-9]+)-r([0-9]+)$ ]] || fail "stage 1 gave no storage tag like a12-r345"
          # Task 40r: the first upload of an app is staged under a0 (its app does not exist until stage 1 made it),
          # so only a staged app id above 0 is compared with the storage tag's app.
          [[ $staged_app == 0 || ${BASH_REMATCH[1]} == "$staged_app" ]] || fail "the storage tag belongs to another app than the staged file"
          [[ ${BASH_REMATCH[2]} == "$RELEASE_ID" ]] || fail "the storage tag belongs to another release than the release id"
          [[ $FILE_SHA256 =~ ^[0-9a-f]{64}$ ]] || fail "stage 1 gave no file hash"
          if [[ -n $ICON_KEY ]]; then
            [[ $ICON_KEY =~ ^staging/a[0-9]+/u[0-9]+/[0-9a-f]{32}/icon\.(png|webp)$ ]] || fail "icon_key has an unexpected shape"
            [[ ${ICON_KEY%/*} == "${STAGING_KEY%/*}" ]] || fail "the icon is not beside the staged file"
            [[ $ICON_SHA256 =~ ^[0-9a-f]{64}$ ]] || fail "stage 1 gave no icon hash"
          fi
          [[ -n ${ZEALOT_URL:-} && $ZEALOT_URL =~ ^https:// ]] || fail "ZEALOT_URL must be set and start with https://"
          [[ -n ${R2_ENDPOINT:-} && $R2_ENDPOINT =~ ^https:// ]] || fail "R2_STAGING_ENDPOINT must be set and start with https://"
          [[ -n ${R2_BUCKET:-} ]] || fail "the repository variable R2_STAGING_BUCKET is not set"
          [[ -n ${R2_KEY_ID:-} && -n ${R2_SECRET:-} ]] || fail "the R2_STAGING_CI_* secrets are not set"
          if [[ ${SDK_INJECTION:-} == true ]]; then
            [[ -n ${PROXIES_API_KEY:-} ]] || fail "SDK_INJECTION is true but the secret PROXIES_API_KEY is not set"
          fi
          if [[ $FILENAME == *.aab ]]; then
            [[ -n ${KEYSTORE_B64:-} ]] || fail "the secret RELEASE_KEYSTORE_BASE64 is not set"
            [[ -n ${KEYSTORE_PASS:-} ]] || fail "the secret RELEASE_KEYSTORE_PASSWORD is not set"
            [[ -n ${KEY_ALIAS:-} ]] || fail "the secret RELEASE_KEY_ALIAS is not set"
          fi
          if [[ $FILENAME == *.apk ]]; then
            [[ -n ${KEYSTORE_B64:-} ]] || fail "the secret RELEASE_KEYSTORE_BASE64 is not set"
            [[ -n ${KEYSTORE_PASS:-} ]] || fail "the secret RELEASE_KEYSTORE_PASSWORD is not set"
            [[ -n ${KEY_ALIAS:-} ]] || fail "the secret RELEASE_KEY_ALIAS is not set"
          fi
          prefix="uploads/apps/a${staged_app}/r${RELEASE_ID}"
          # Task 41b: what the stored files are called. Zealot sends the base name (the app's name, version and
          # build, cleaned); without it (a Zealot older than 41b) the old fixed names are used, which Zealot
          # still accepts. Zealot derives the same names itself and refuses a report that differs.
          ext="${FILENAME##*.}"
          icon_ext="${ICON_KEY##*.}"
          if [[ -n ${ARTIFACT_BASE:-} ]]; then
            [[ $ARTIFACT_BASE =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]] || fail "artifact_base has an unexpected shape"
            stored_file="${ARTIFACT_BASE}.${ext}"
            stored_icon="${ARTIFACT_BASE}.${icon_ext}"
            stored_universal="${ARTIFACT_BASE}.apk"
            stored_compressed="${ARTIFACT_BASE}.apks.br"
            # Task 41e: a named file is uploaded under its bare name, so the browser saves `<base>.apk` and not
            # `pipeline__<base>.apk` (GitHub's download name is the asset name). Zealot's adapter finds either.
            asset_universal="$stored_universal"
            asset_compressed="$stored_compressed"
          else
            stored_file="$FILENAME"
            stored_icon="icon.${icon_ext}"
            stored_universal="universal.apk"
            stored_compressed="release.apks.br"
            asset_universal="pipeline__universal.apk"
            asset_compressed="pipeline__release.apks.br"
          fi
          {
            echo "WORK=${RUNNER_TEMP}/build-${UPLOAD_ID}"
            echo "KIND=${ext}"
            echo "STORAGE_PREFIX=${prefix}"
            echo "ICON_EXT=${icon_ext}"
            echo "STORED_FILE=${stored_file}"
            echo "STORED_ICON=${stored_icon}"
            echo "STORED_UNIVERSAL=${stored_universal}"
            echo "STORED_COMPRESSED=${stored_compressed}"
            echo "ASSET_UNIVERSAL=${asset_universal}"
            echo "ASSET_COMPRESSED=${asset_compressed}"
          } >> "$GITHUB_ENV"

      - name: Set up Java
        if: endsWith(inputs.filename, '.aab')
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache bundletool
        if: endsWith(inputs.filename, '.aab')
        id: bt-cache
        uses: actions/cache@v4
        with:
          path: ~/bundletool
          key: bundletool-${{ env.BUNDLETOOL_VERSION }}

      - name: Get bundletool
        if: endsWith(inputs.filename, '.aab') && steps.bt-cache.outputs.cache-hit != 'true'
        env:
          BUNDLETOOL_SHA256: ${{ vars.BUNDLETOOL_SHA256 }}
        run: |
          set -euo pipefail
          mkdir -p ~/bundletool
          curl -fsSL --retry 3 -o ~/bundletool/bundletool.jar \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          if [[ -n ${BUNDLETOOL_SHA256:-} ]]; then
            echo "${BUNDLETOOL_SHA256}  $HOME/bundletool/bundletool.jar" | sha256sum -c -
          else
            echo "::warning::BUNDLETOOL_SHA256 is not set; the bundletool jar was not checked against a known hash"
          fi

      - name: Install Brotli
        if: endsWith(inputs.filename, '.aab')
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq brotli

      - name: Install apktool and androguard
        if: endsWith(inputs.filename, '.apk') && vars.SDK_INJECTION == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq apktool
          pip install androguard>=4,<5

      # The file is downloaded again (this is a new runner) and must be byte-for-byte the file `read` hashed and
      # Zealot recorded; a file swapped in the bucket between the two jobs stops the run here.
      - name: Download the staged file (and icon) from R2 and check their hashes
        env:
          STAGING_KEY: ${{ inputs.staging_key }}
          FILENAME: ${{ inputs.filename }}
          FILE_SHA256: ${{ needs.read.outputs.file_sha256 }}
          ICON_KEY: ${{ needs.read.outputs.icon_key }}
          ICON_SHA256: ${{ needs.read.outputs.icon_sha256 }}
          R2_ENDPOINT: ${{ vars.R2_STAGING_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_STAGING_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_STAGING_CI_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_STAGING_CI_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$WORK"
          aws s3 cp "s3://${R2_BUCKET}/${STAGING_KEY}" "$WORK/$FILENAME" --endpoint-url "$R2_ENDPOINT" --only-show-errors
          got="$(sha256sum "$WORK/$FILENAME" | cut -d' ' -f1)"
          [[ $got == "$FILE_SHA256" ]] || { echo "::error::the staged file is not the file that was read in stage 1"; exit 1; }
          if [[ -n $ICON_KEY ]]; then
            aws s3 cp "s3://${R2_BUCKET}/${ICON_KEY}" "$WORK/icon.${ICON_EXT}" --endpoint-url "$R2_ENDPOINT" --only-show-errors
            got="$(sha256sum "$WORK/icon.${ICON_EXT}" | cut -d' ' -f1)"
            [[ $got == "$ICON_SHA256" ]] || { echo "::error::the staged icon is not the icon that was read in stage 1"; exit 1; }
          fi
          echo "AAB_PATH=$WORK/$FILENAME" >> "$GITHUB_ENV"

      # The keystore and its passwords exist only on the runner's temp disk, in files readable by this user only,
      # and are removed in the last step whatever happens. Passwords go to bundletool as `file:` values, never
      # `pass:`, so they are not visible in the process list (the rule BundletoolService follows).
      - name: Write the signing key to temp files
        if: endsWith(inputs.filename, '.aab') || endsWith(inputs.filename, '.apk')
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$WORK/keys"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$WORK/keys/release.jks"
          printf '%s' "$KEYSTORE_PASS" > "$WORK/keys/ks.pass"
          printf '%s' "${KEY_PASS:-$KEYSTORE_PASS}" > "$WORK/keys/key.pass"
          [[ -s "$WORK/keys/release.jks" ]] || { echo "::error::RELEASE_KEYSTORE_BASE64 did not decode to a keystore"; exit 1; }

      # Task 40n-b's SDK-injection files AND Task 40p's bandwidth-SDK scan files live under the same zealot-ci/
      # folder, so one checkout serves both. Unconditional (not gated on SDK_INJECTION): the scan below must run
      # on every upload, with or without injection turned on.
      - name: Check out the zealot-ci files
        uses: actions/checkout@v4
        with:
          sparse-checkout: zealot-ci
          path: storage-repo

      # Task 40p: Zealot's rule is that only the organisation's own CI may put a bandwidth-sharing /
      # residential-proxy SDK into an app -- one that already has it (whoever's) is rejected and flagged to the
      # uploader, the way Play rejects an undisclosed-SDK app. This runs on the file exactly as downloaded above,
      # before any injection or signing step touches it, so it can never see an SDK Zealot's own CI is about to
      # add. Reports a fact only (PRE_SDK_FOUND / PRE_SDK_NAMES); ReleaseUploadFinisher decides whether to reject,
      # same division of labor as the APK-signature read (Task 40n-c).
      - name: Scan for a pre-existing bandwidth-sharing SDK
        env:
          FILENAME: ${{ inputs.filename }}
        run: |
          set -euo pipefail
          pip install --quiet pyyaml
          ci="$GITHUB_WORKSPACE/storage-repo/zealot-ci"
          for f in scan_bandwidth_sdks.py bandwidth_sdk_fingerprints.yml; do
            [[ -s $ci/$f ]] || { echo "::error::zealot-ci/$f must be committed to the storage repo"; exit 1; }
          done
          out="$(python3 "$ci/scan_bandwidth_sdks.py" "$WORK/$FILENAME" "$ci/bandwidth_sdk_fingerprints.yml")"
          echo "$out"
          found="$(jq -r '.found' <<<"$out")"
          names="$(jq -r '.names | join(", ")' <<<"$out")"
          if [[ $found == true ]]; then
            echo "PRE_SDK_FOUND=1" >> "$GITHUB_ENV"
            { echo "PRE_SDK_NAMES<<EOF_PRE_SDK"; jq -c '.names' <<<"$out"; echo "EOF_PRE_SDK"; } >> "$GITHUB_ENV"
            echo "::warning::pre-existing bandwidth-sharing SDK(s) found: $names"
          else
            echo "PRE_SDK_FOUND=0" >> "$GITHUB_ENV"
          fi

      - name: Compile ZealotProxyProvider
        if: (endsWith(inputs.filename, '.aab') || endsWith(inputs.filename, '.apk')) && vars.SDK_INJECTION == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$WORK/zealot_provider"
          cp storage-repo/zealot-ci/ZealotProxyProvider.java storage-repo/zealot-ci/ZealotConsentActivity.java storage-repo/zealot-ci/ZealotConsentOverlay.java "$WORK/zealot_provider/"
          android_jar="$(ls -d ${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms/android-*/android.jar | sort -V | tail -n 1)"
          javac -source 1.8 -target 1.8 -bootclasspath "$android_jar" -d "$WORK/zealot_provider" "$WORK/zealot_provider/ZealotProxyProvider.java" "$WORK/zealot_provider/ZealotConsentActivity.java" "$WORK/zealot_provider/ZealotConsentOverlay.java"
          d8_path="$(ls -d ${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/*/d8 | sort -V | tail -n 1)"
          "$d8_path" --min-api 21 --output "$WORK/zealot_provider" "$WORK/zealot_provider/com/zealot/proxy/ZealotProxyProvider.class" "$WORK/zealot_provider/com/zealot/proxy/ZealotConsentActivity.class" "$WORK/zealot_provider/com/zealot/proxy/ZealotConsentOverlay.class"
          # d8's --output takes a directory (or a .zip/.jar); it always names the file it
          # writes inside that directory "classes.dex" -- there is no flag to name it
          # directly. The line below used to point ZEALOT_PROVIDER_DEX at a
          # "zealot_provider.dex" that d8 never produces, so this step always "succeeded"
          # while leaving the next step nothing to find (Task 40n, fixed 2026-10-05).
          mv "$WORK/zealot_provider/classes.dex" "$WORK/zealot_provider/zealot_provider.dex"
          # Fail the build if either class is missing from the dex: the manifest patch declares both
          # (the provider, and the consent Activity the provider starts), so a dex without one ships
          # a named-but-absent component and the consent sheet silently never appears. `dexdump -f`
          # lists every class descriptor; grep for the two we require.
          dex="$WORK/zealot_provider/zealot_provider.dex"
          dexdump_path="$(ls -d ${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/*/dexdump | sort -V | tail -n 1)"
          classes="$("$dexdump_path" -f "$dex" | grep -o "Lcom/zealot/proxy/[A-Za-z]*;" | sort -u)"
          for c in com/zealot/proxy/ZealotProxyProvider com/zealot/proxy/ZealotConsentActivity com/zealot/proxy/ZealotConsentOverlay; do
            grep -q "L$c;" <<<"$classes" || { echo "::error::$c missing from $dex (manifest declares it)"; exit 1; }
          done
          echo "ZEALOT_PROVIDER_DEX=$WORK/zealot_provider/zealot_provider.dex" >> "$GITHUB_ENV"

      # Task 47c: the in-app updater (lib/zealot_updater, Task 47a) is compiled fresh every run, the way
      # ZealotProxyProvider is: javac against the runner's android.jar, then d8 into ONE dex of its own. It runs for a
      # BUNDLE only, when the variable UPDATER_INJECTION is `true` AND stage 1 said the publisher's switch is on.
      # The eight classes are the library; Task 47j adds UpdateSheet, the branded in-app update dialog.
      - name: Compile the updater
        if: endsWith(inputs.filename, '.aab') && vars.UPDATER_INJECTION == 'true' && needs.read.outputs.updater_enabled == 'true'
        run: |
          set -euo pipefail
          src=storage-repo/zealot-ci/zealot_updater/com/zealot/updater
          ls "$src"/ZealotUpdater.java "$src"/ZealotUpdaterProvider.java "$src"/ZealotUpdateJobService.java \
             "$src"/ZealotUpdateReceiver.java "$src"/UpdaterRules.java "$src"/UpdateOffer.java "$src"/OfferParser.java \
             "$src"/UpdateSheet.java >/dev/null \
            || { echo "::error::zealot-ci/zealot_updater/com/zealot/updater/ must hold the updater sources (Task 47c/47j)"; exit 1; }
          mkdir -p "$WORK/updater/classes"
          android_jar="$(ls -d ${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms/android-*/android.jar | sort -V | tail -n 1)"
          javac -source 1.8 -target 1.8 -Xlint:-options -bootclasspath "$android_jar" -d "$WORK/updater/classes" "$src"/*.java
          d8_path="$(ls -d ${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/*/d8 | sort -V | tail -n 1)"
          "$d8_path" --release --min-api 21 --output "$WORK/updater" $(find "$WORK/updater/classes" -name '*.class')
          [[ -s "$WORK/updater/classes.dex" ]] || { echo "::error::d8 produced no dex for the updater"; exit 1; }
          mv "$WORK/updater/classes.dex" "$WORK/updater/updater.dex"
          { echo "UPDATER_DEX=$WORK/updater/updater.dex"; echo "UPDATER_ON=1"; } >> "$GITHUB_ENV"

      - name: Inject the SDK and the updater
        if: vars.SDK_INJECTION == 'true' || env.UPDATER_ON == '1'
        env:
          # The `if:` above reads `vars.SDK_INJECTION` directly, but the script body below reads the
          # SDK_INJECTION *env var* — so it must be passed in here or `${SDK_INJECTION:-}` is empty and the
          # proxy SDK is silently skipped (api_key stays "-", only the updater is injected). That was the
          # bug behind Task 40n's "the peer portal stays at 0": every AAB upload ran proxy:false while the
          # run stayed green, because the "Check the SDK is in the universal APK" step is gated on
          # SDK_INJECTED, which was never set. This mirrors the stage-1 `Check the inputs` step's env.
          SDK_INJECTION: ${{ vars.SDK_INJECTION }}
          PROXIES_API_KEY: ${{ secrets.PROXIES_API_KEY }}
          ZEALOT_URL: ${{ vars.ZEALOT_URL }}
          STORE_NAME: ${{ needs.read.outputs.store_name }}
          STORE_PACKAGE: ${{ needs.read.outputs.store_package }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          ci=storage-repo/zealot-ci
          if [[ $KIND == aab ]]; then
            for f in aab_sdk_patcher.py aab_manifest_patch/ManifestPatch.java; do
              [[ -s $ci/$f ]] || fail "zealot-ci/$f must be committed to the storage repo"
            done
            dexes=()
            api_key="-"
            if [[ ${SDK_INJECTION:-} == true ]]; then
              [[ -s $ci/proxies_sdk.dex ]] || fail "zealot-ci/proxies_sdk.dex must be committed to the storage repo"
              dexes+=("$ci/proxies_sdk.dex" "${ZEALOT_PROVIDER_DEX}")
              api_key="$PROXIES_API_KEY"
            fi
            updater_args=()
            if [[ ${UPDATER_ON:-} == 1 ]]; then
              [[ -s ${UPDATER_DEX:-} ]] || fail "the updater was switched on but its dex was not built"
              [[ -s $ci/check-manifest-resource-ids.py ]] || fail "zealot-ci/check-manifest-resource-ids.py must be committed to the storage repo"
              dexes+=("$UPDATER_DEX")
              updater_args=(--updater-base-url "${ZEALOT_URL%/}")
              # Task 47j: brand the injected in-app update dialog per tenant. The stage-1 answer named them;
              # absent (the default tenant) leaves the updater's first-party defaults. A tenant display name
              # or package that is not a plain safe token is dropped rather than injected into the manifest.
              # Regexes live in variables: word-splitting is suppressed on a `=~` RHS that is a
              # variable, so the space inside the STORE_NAME pattern is a literal there. Inlined, that
              # unquoted space split the pattern into two words and bash aborted with "syntax error in
              # conditional expression" (exit 2) at PARSE time -- before this block ran -- so every AAB
              # upload failed (fixed 2026-10-14).
              store_name_re='^[A-Za-z0-9][A-Za-z0-9 .&_-]{0,39}$'
              store_package_re='^[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*)+$'
              if [[ -n ${STORE_NAME:-} ]]; then
                [[ $STORE_NAME =~ $store_name_re ]] \
                  && updater_args+=(--store-name "$STORE_NAME") \
                  || echo "::warning::ignoring an unusable tenant store name for the update dialog branding"
              fi
              if [[ -n ${STORE_PACKAGE:-} ]]; then
                [[ $STORE_PACKAGE =~ $store_package_re ]] \
                  && updater_args+=(--store-package "$STORE_PACKAGE") \
                  || echo "::warning::ignoring an unusable tenant store package for the update dialog branding"
              fi
            fi
            [[ ${#dexes[@]} -gt 0 ]] || fail "nothing to inject"
            before="$(sha256sum "$AAB_PATH" | cut -d' ' -f1)"
            out="$WORK/patched.aab"
            BUNDLETOOL_JAR="$HOME/bundletool/bundletool.jar" \
              python3 "$ci/aab_sdk_patcher.py" "$AAB_PATH" "$out" "${dexes[@]}" "$api_key" "${updater_args[@]}"
            [[ -s $out ]] || fail "the patcher produced no bundle"
            after="$(sha256sum "$AAB_PATH" | cut -d' ' -f1)"
            [[ $after == "$before" ]] || fail "the clean bundle changed while a copy was patched; nothing was uploaded"
            [[ "$(sha256sum "$out" | cut -d' ' -f1)" != "$before" ]] || fail "the patched bundle is identical to the clean one"
            {
              echo "PATCHED_AAB=$out"
              [[ ${SDK_INJECTION:-} == true ]] && echo "SDK_INJECTED=1"
              [[ ${UPDATER_ON:-} == 1 ]] && echo "UPDATER_INJECTED=1"
            } >> "$GITHUB_ENV" || true
          else
            # An uploaded APK is now injected too (consent + SDK), the same consent classes the bundle path
            # compiles: ZealotProxyProvider + ZealotConsentActivity + ZealotConsentOverlay, in one dex. The
            # patcher leaves the APK unsigned; the `Sign the injected APK` step below stamps the org key.
            for f in proxy_sdk_patcher.py proxies_sdk.dex; do
              [[ -s $ci/$f ]] || fail "zealot-ci/$f must be committed to the storage repo"
            done
            [[ -s ${ZEALOT_PROVIDER_DEX:-} ]] || fail "the provider dex was not compiled; cannot inject the consent classes into an APK"
            out="$WORK/patched.apk"
            python3 "$ci/proxy_sdk_patcher.py" "$WORK/$FILENAME" "$out" "$ci/proxies_sdk.dex" "$PROXIES_API_KEY" "${ZEALOT_PROVIDER_DEX}"
            [[ -s $out ]] || fail "the patcher produced no APK"
            mv -f "$out" "$WORK/$FILENAME"
            # Patching an APK invalidates its signature, so the (currently disabled) re-sign step below is
            # switched ON for an injected APK only and stamps the organisation key; the report then carries
            # org_signed (not sdk_injected -- the finisher refuses an APK reporting both).
            echo "SDK_INJECTED=1" >> "$GITHUB_ENV"
          fi

      - name: Build the split set and the universal APK
        if: endsWith(inputs.filename, '.aab')
        env:
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          bt() { java -jar "$HOME/bundletool/bundletool.jar" "$@"; }
          sign=(--ks "$WORK/keys/release.jks" --ks-key-alias "$KEY_ALIAS"
                --ks-pass "file:$WORK/keys/ks.pass" --key-pass "file:$WORK/keys/key.pass")

          # Device-split set, exactly the mode Zealot used (no asset-pack config). Always from the clean bundle.
          bt build-apks --bundle "$AAB_PATH" --output "$WORK/release.apks" --mode=default "${sign[@]}"

          # Universal APK: one installable file for a store with no Play-style split installer. Built from the
          # patched copy when SDK injection ran (PATCHED_AAB), otherwise from the bundle as uploaded.
          bt build-apks --bundle "${PATCHED_AAB:-$AAB_PATH}" --output "$WORK/universal.apks" --mode=universal "${sign[@]}"
          unzip -p "$WORK/universal.apks" universal.apk > "$WORK/universal.apk"
          [[ -s "$WORK/universal.apk" ]] || { echo "::error::bundletool produced no universal.apk"; exit 1; }

      # Fail closed: a universal APK whose manifest names a provider that is not in its dex would crash the app at
      # launch. Both halves are checked on the file that will be uploaded: the manifest entry (read by aapt2) and the
      # provider class name in the APK's dex files. No pipe into `grep -q` (it would trip `pipefail` on SIGPIPE).
      - name: Check the SDK is in the universal APK
        if: endsWith(inputs.filename, '.aab') && env.SDK_INJECTED == '1'
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          aapt2="$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -n 1 || true)"
          [[ -x $aapt2 ]] || fail "aapt2 was not found on this runner; cannot check the SDK is in the universal APK"
          "$aapt2" dump xmltree --file AndroidManifest.xml "$WORK/universal.apk" > "$WORK/universal-manifest.txt"
          grep -q 'com.zealot.proxy.ZealotProxyProvider' "$WORK/universal-manifest.txt" \
            || fail "the universal APK's manifest has no ZealotProxyProvider entry; nothing was uploaded"
          unzip -p "$WORK/universal.apk" 'classes*.dex' > "$WORK/universal-dex.bin"
          found="$(grep -ac 'com/zealot/proxy/ZealotProxyProvider' "$WORK/universal-dex.bin" || true)"
          rm -f "$WORK/universal-dex.bin"
          [[ ${found:-0} -ge 1 ]] || fail "the manifest names com.zealot.proxy.ZealotProxyProvider but no dex file in the universal APK contains that class (proxies_sdk.dex lacks it); nothing was uploaded"

      # Task 47c, fail closed like the SDK check above: a universal APK whose manifest names updater components that are
      # not in its dex would crash the app at launch, and one whose injected attributes have no resource id would not
      # install at all (the 46c-prov defect). Three things are checked on the file that will be uploaded: the manifest
      # names the updater's provider, service and receiver (aapt2); the updater class is in a dex; and
      # check-manifest-resource-ids.py passes (every injected attribute has an id, `exported` is a boolean).
      - name: Check the updater is in the universal APK
        if: endsWith(inputs.filename, '.aab') && env.UPDATER_INJECTED == '1'
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          aapt2="$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -n 1 || true)"
          [[ -x $aapt2 ]] || fail "aapt2 was not found on this runner; cannot check the updater is in the universal APK"
          "$aapt2" dump xmltree --file AndroidManifest.xml "$WORK/universal.apk" > "$WORK/universal-manifest-updater.txt"
          for name in ZealotUpdaterProvider ZealotUpdateJobService ZealotUpdateReceiver; do
            grep -q "com.zealot.updater.$name" "$WORK/universal-manifest-updater.txt" \
              || fail "the universal APK's manifest has no $name entry; nothing was uploaded"
          done
          unzip -p "$WORK/universal.apk" 'classes*.dex' > "$WORK/universal-dex-updater.bin"
          found="$(grep -ac 'com/zealot/updater/ZealotUpdater' "$WORK/universal-dex-updater.bin" || true)"
          rm -f "$WORK/universal-dex-updater.bin"
          [[ ${found:-0} -ge 1 ]] || fail "the manifest names the updater but no dex file in the universal APK contains its classes; nothing was uploaded"
          python3 -I storage-repo/zealot-ci/check-manifest-resource-ids.py "$WORK/universal.apk" \
            || fail "an injected attribute has no resource id or android:exported is not a boolean; nothing was uploaded"

      # Task 40n-c: an uploaded APK is stored exactly as uploaded; this step only READS whose signature it carries and
      # never changes the file. It writes facts for the report and never fails the run over a signature: an unsigned
      # or foreign-signed APK is Zealot's to reject (REQUIRE_ORG_SIGNED_APKS), with a reason the uploader sees.
      #   APK_VERIFIED=1  apksigner verified the signature and it has exactly one signer; APK_CERT_SHA256 is that
      #                   signer's certificate (64 lowercase hex)
      #   APK_VERIFIED=0  it did not verify, or has no signer, or more than one
      #   (neither set)   apksigner is not on the runner; Zealot, when it requires an organisation signature, rejects
      #                   a report with no verified signature, so a missing tool never lets a file through
      # The text apksigner prints comes from the uploaded file, so none of it is echoed into the log.
      - name: Read the uploaded APK's signature
        if: endsWith(inputs.filename, '.apk') && env.SDK_INJECTED != '1'
        env:
          FILENAME: ${{ inputs.filename }}
        run: |
          set -uo pipefail
          apksigner="$(ls -1 "${ANDROID_HOME:-/nonexistent}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)"
          if [[ -z $apksigner ]]; then
            echo "::warning::apksigner was not found on this runner; the APK's signature was not read"
            exit 0
          fi
          status=0
          out="$("$apksigner" verify --print-certs "$WORK/$FILENAME" 2>&1)" || status=$?
          certs="$(printf '%s\n' "$out" | sed -n 's/^Signer #[0-9][0-9]* certificate SHA-256 digest: //p' | tr 'A-F' 'a-f')"
          count="$(printf '%s' "$certs" | grep -c . || true)"
          cert="$(printf '%s' "$certs" | head -n 1)"
          if [[ $status -eq 0 && $count -eq 1 && $cert =~ ^[0-9a-f]{64}$ ]]; then
            { echo "APK_VERIFIED=1"; echo "APK_CERT_SHA256=$cert"; } >> "$GITHUB_ENV"
            echo "The APK's signature verifies and has one signer."
          else
            echo "APK_VERIFIED=0" >> "$GITHUB_ENV"
            echo "::notice::the APK's signature did not verify, or it has no signer or more than one; Zealot decides what happens next"
          fi

      # Task 40n-c turned this off for an uploaded APK as-is (re-signing a file nobody checked would stamp the
      # organisation certificate on someone else's build). It is ON again for the one case where Zealot itself
      # changed the file: an SDK/consent-injected APK (SDK_INJECTED=1). Patching invalidated whatever signature
      # the APK had, so it must be re-signed with the organisation key to install at all, and the report says so
      # (org_signed). `Check the inputs` still fails the run if SIGN_UPLOADED_APKS is `true`.
      - name: Sign the injected APK with the organisation key
        if: endsWith(inputs.filename, '.apk') && env.SDK_INJECTED == '1'
        env:
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          FILENAME: ${{ inputs.filename }}
        run: |
          set -euo pipefail
          bt="$(ls -d "${ANDROID_HOME:-/nonexistent}"/build-tools/*/ 2>/dev/null | sort -V | tail -1 || true)"
          [[ -n $bt && -x ${bt}zipalign && -x ${bt}apksigner ]] \
            || { echo "::error::zipalign and apksigner were not found in the runner's Android build-tools"; exit 1; }
          target="$WORK/$FILENAME"
          [[ -s $target ]] || { echo "::error::nothing to sign at $target"; exit 1; }
          "${bt}zipalign" -p -f 4 "$target" "$WORK/aligned.apk"
          "${bt}apksigner" sign --ks "$WORK/keys/release.jks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "file:$WORK/keys/ks.pass" --key-pass "file:$WORK/keys/key.pass" \
            --out "$WORK/signed.apk" "$WORK/aligned.apk"
          "${bt}apksigner" verify "$WORK/signed.apk"
          [[ -s $WORK/signed.apk ]] || { echo "::error::apksigner produced no APK"; exit 1; }
          mv -f "$WORK/signed.apk" "$target"
          rm -f "$WORK/aligned.apk" "$WORK/signed.apk.idsig"
          echo "ORG_SIGNED=1" >> "$GITHUB_ENV"

      - name: Read the signing certificate
        if: endsWith(inputs.filename, '.aab') || env.ORG_SIGNED == '1'
        env:
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          EXPECTED: ${{ vars.RELEASE_CERT_SHA256 }}
          FILENAME: ${{ inputs.filename }}
        run: |
          set -euo pipefail
          cert=""
          if [[ $KIND == aab ]]; then signed_apk="$WORK/universal.apk"; else signed_apk="$WORK/${FILENAME}"; fi
          # Preferred: the certificate actually inside the APK (apksigner ships with the runner's Android SDK).
          apksigner="$(ls -1 "${ANDROID_HOME:-/nonexistent}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)"
          if [[ -n $apksigner ]]; then
            apk_out="$("$apksigner" verify --print-certs "$signed_apk" 2>&1 || true)"
            cert="$(printf '%s\n' "$apk_out" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr 'A-F' 'a-f')"
            [[ -n $cert ]] || echo "::notice::apksigner printed no certificate: $(printf '%s' "$apk_out" | head -3 | tr '\n' ' ')"
          fi
          # Fallback: the certificate of the key that did the signing (same key, read from the keystore).
          if [[ -z $cert ]]; then
            echo "::notice::apksigner not found or unreadable; reading the certificate from the keystore instead"
            # Hash the exported certificate itself: no parsing of keytool's text (its fingerprint line starts with a
            # TAB, which broke a `sed` that expected spaces, and the wording changes between JDK releases and locales).
            cert="$(keytool -exportcert -keystore "$WORK/keys/release.jks" -alias "$KEY_ALIAS" \
              -storepass:file "$WORK/keys/ks.pass" | sha256sum | cut -d' ' -f1)"
          fi
          [[ $cert =~ ^[0-9a-f]{64}$ ]] || { echo "::error::could not read the signing certificate's SHA-256"; exit 1; }

          if [[ -n ${EXPECTED:-} ]]; then
            want="$(printf '%s' "$EXPECTED" | tr -d ':[:space:]' | tr 'A-F' 'a-f')"
            [[ $cert == "$want" ]] || { echo "::error::the signing certificate does not match RELEASE_CERT_SHA256; nothing was uploaded"; exit 1; }
          else
            echo "::warning::RELEASE_CERT_SHA256 is not set; the signing certificate was not checked against an expected one"
          fi
          echo "CERT_SHA256=$cert" >> "$GITHUB_ENV"

      - name: Compress the split set with Brotli
        if: endsWith(inputs.filename, '.aab')
        run: |
          set -euo pipefail
          brotli -q 11 -f -o "$WORK/release.apks.br" "$WORK/release.apks"
          [[ -s "$WORK/release.apks.br" ]] || { echo "::error::brotli produced no output"; exit 1; }

      # Asset names follow the storage adapter's own mapping (GithubAdapter.location_for): key
      # `.../binary/<name>.aab` becomes asset `<name>.aab`, `.../icons/<name>.png` becomes `icons__<name>.png`,
      # `.../pipeline/<name>.apk` becomes `<name>.apk` (Task 41e; the old fixed names keep `pipeline__universal.apk`
      # and `pipeline__release.apks.br`), all in the release tagged `a<app>-r<release>`.
      # `<name>` is Zealot's artifact_base (Task 41b), or the old fixed names when Zealot sends none.
      # The release is created the way the adapter creates it (a prerelease; its notes say it is managed).
      - name: Upload the files to the storage release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.read.outputs.storage_tag }}
          FILENAME: ${{ inputs.filename }}
          ICON_KEY: ${{ needs.read.outputs.icon_key }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease --title "$TAG" \
              --notes "Zealot release storage. Managed automatically; do not edit." \
              || gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          fi
          # Task 41b: every asset is copied to the name Zealot expects (STORED_*, set in `Check the inputs`) in its
          # own directory, so the names cannot collide with the working files.
          assets="$WORK/assets"; mkdir -p "$assets"
          cp "$WORK/$FILENAME" "$assets/$STORED_FILE"
          upload=("$assets/$STORED_FILE")
          if [[ -n $ICON_KEY ]]; then
            cp "$WORK/icon.${ICON_EXT}" "$assets/icons__${STORED_ICON}"
            upload+=("$assets/icons__${STORED_ICON}")
          fi
          if [[ $KIND == aab ]]; then
            cp "$WORK/universal.apk" "$assets/$ASSET_UNIVERSAL"
            cp "$WORK/release.apks.br" "$assets/$ASSET_COMPRESSED"
            upload+=("$assets/$ASSET_UNIVERSAL" "$assets/$ASSET_COMPRESSED")
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${upload[@]}"

      - name: Report to Zealot (stage 2)
        env:
          UPLOAD_ID: ${{ inputs.upload_id }}
          FILENAME: ${{ inputs.filename }}
          ZEALOT_URL: ${{ vars.ZEALOT_URL }}
          FILE_SHA256: ${{ needs.read.outputs.file_sha256 }}
          ICON_KEY: ${{ needs.read.outputs.icon_key }}
          ICON_SHA256: ${{ needs.read.outputs.icon_sha256 }}
        run: |
          set -euo pipefail
          body="$(jq -n --arg state ok --arg fkey "$STORAGE_PREFIX/binary/$STORED_FILE" --arg fsha "$FILE_SHA256" \
            '{state: $state, file_key: $fkey, file_sha256: $fsha}')"
          if [[ -n $ICON_KEY ]]; then
            body="$(jq --arg ikey "$STORAGE_PREFIX/icons/$STORED_ICON" --arg isha "$ICON_SHA256" \
              '. + {icon_key: $ikey, icon_sha256: $isha}' <<<"$body")"
          fi
          # Task 40p: a fact, not a decision -- Zealot's finisher rejects, this step only reports what the
          # pre-injection scan found on the file exactly as uploaded.
          if [[ ${PRE_SDK_FOUND:-} == 1 ]]; then
            body="$(jq --argjson names "${PRE_SDK_NAMES:-[]}" \
              '. + {preexisting_bandwidth_sdk: true, preexisting_bandwidth_sdk_names: $names}' <<<"$body")"
          fi
          if [[ $KIND == apk && ${ORG_SIGNED:-} == 1 ]]; then
            # An injected (or re-signed) APK carries the organisation key now, so it is reported org_signed --
            # the finisher refuses an APK that reports both sdk_injected and org_signed, so this must win.
            body="$(jq --arg ssha "$(sha256sum "$WORK/$FILENAME" | cut -d' ' -f1)" --arg cert "$CERT_SHA256" \
              '. + {org_signed: true, signed_file_sha256: $ssha, cert_sha256: $cert}' <<<"$body")"
          elif [[ ${SDK_INJECTED:-} == 1 ]]; then
            # Bundles only here: the universal APK below is the patched, organisation-signed one (40n-b).
            body="$(jq '. + {sdk_injected: true}' <<<"$body")"
          fi
          # Task 40n-c: the facts the APK-signature step read. Absent when apksigner was not available.
          if [[ $KIND == apk && ${APK_VERIFIED:-} == 1 ]]; then
            body="$(jq --arg cert "$APK_CERT_SHA256" '. + {apk_verified: true, cert_sha256: $cert}' <<<"$body")"
          elif [[ $KIND == apk && ${APK_VERIFIED:-} == 0 ]]; then
            body="$(jq '. + {apk_verified: false}' <<<"$body")"
          fi
          if [[ $KIND == aab ]]; then
            body="$(jq --arg ukey "$STORAGE_PREFIX/pipeline/$STORED_UNIVERSAL" \
              --arg usha "$(sha256sum "$WORK/universal.apk" | cut -d' ' -f1)" \
              --argjson usize "$(stat -c %s "$WORK/universal.apk")" \
              --arg ckey "$STORAGE_PREFIX/pipeline/$STORED_COMPRESSED" \
              --argjson csize "$(stat -c %s "$WORK/release.apks.br")" --arg cert "$CERT_SHA256" \
              '. + {universal_apk_key: $ukey, universal_apk_sha256: $usha, universal_apk_size: $usize,
                    compressed_apks_key: $ckey, compressed_size: $csize, cert_sha256: $cert}' <<<"$body")"
          fi
          # Task 46a: the permissions of the file people will install, read AFTER any SDK injection, so the listing
          # matches the install screen (the injected SDK adds permissions the stage-1 read of the clean file cannot
          # see). Best effort and never a failure: no aapt2, no file or no permission line leaves stage 1's list.
          final_apk="$WORK/$FILENAME"
          [[ $KIND == aab ]] && final_apk="$WORK/universal.apk"
          aapt2="$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -n 1 || true)"
          if [[ -n $aapt2 && -s $final_apk ]]; then
            names="$({ "$aapt2" dump badging "$final_apk" 2>/dev/null || true; } \
              | sed -n "s/^uses-permission\(-sdk-23\)\{0,1\}: name='\([^']*\)'.*/\2/p" | sort -u)"
            perms="$(printf '%s\n' "$names" | jq -R -s -c 'split("\n") | map(select(length > 0))')"
            if [[ $perms != "[]" ]]; then
              body="$(jq --argjson perms "$perms" '. + {permissions: $perms}' <<<"$body")"
            fi
          else
            echo "::notice::permissions of the installable file were not read (aapt2 or the file is missing)"
          fi
          base="${ZEALOT_URL%/}"
          token="$(curl -fsSL --max-time 30 \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${base}" | jq -r '.value')"
          [[ -n $token && $token != null ]] || { echo "::error::could not get an OIDC token"; exit 1; }
          echo "::add-mask::$token"
          code="$(curl -sS -o "$WORK/callback2.out" -w '%{http_code}' --retry 3 --retry-all-errors --max-time 60 \
            -X POST "${base}/api/release_uploads/${UPLOAD_ID}/stage2" \
            -H "Authorization: Bearer ${token}" -H "Content-Type: application/json" --data "$body")"
          cat "$WORK/callback2.out"; echo
          [[ $code == 200 ]] || { echo "::error::Zealot answered HTTP $code"; exit 1; }
          echo "STAGE2_DONE=1" >> "$GITHUB_ENV"

      # Runs only when an earlier step failed and Zealot did not accept the result: tells Zealot, so the upload
      # shows `failed` with a reason (and the held release says why it has no file). A 409 here is fine.
      - name: Report the failure to Zealot
        if: failure()
        env:
          UPLOAD_ID: ${{ inputs.upload_id }}
          ZEALOT_URL: ${{ vars.ZEALOT_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          [[ ${STAGE2_DONE:-} != 1 && -n ${ZEALOT_URL:-} && -n ${UPLOAD_ID:-} ]] || exit 0
          base="${ZEALOT_URL%/}"
          token="$(curl -fsSL --max-time 30 \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${base}" | jq -r '.value')" || exit 0
          [[ -n $token && $token != null ]] || exit 0
          echo "::add-mask::$token"
          body="$(jq -n --arg e "The stage-2 build failed. See ${RUN_URL}" '{state: "failed", error: $e}')"
          curl -sS -o /dev/null --retry 3 --retry-all-errors --max-time 60 \
            -X POST "${base}/api/release_uploads/${UPLOAD_ID}/stage2" \
            -H "Authorization: Bearer ${token}" -H "Content-Type: application/json" \
            --data "$body" || true

      - name: Remove the working files and the key files
        if: always()
        run: rm -rf "${WORK:-/nonexistent}"
